name: Test

on:
  pull_request:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build + test on Linux/macOS/Windows. This job is required — a red box
  # here means the change should not land.
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --workspace --all-targets --verbose

      - name: Test
        # Two passes — regular tests don't run doc-tests.
        run: |
          cargo test --locked --workspace --verbose
          cargo test --locked --workspace --doc

  # Documentation must build cleanly. Catches broken intra-doc links and
  # malformed code blocks in `///` comments. Required.
  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Format and lint checks. Informational only — a yellow box won't block
  # the merge, but the warnings should be cleaned up over time.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
