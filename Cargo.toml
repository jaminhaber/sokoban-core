[package]
name = "sokoban_core"
version = "0.1.5"
edition = "2021"

authors = ["ShenMian", "jaminhaber"]
license = "MIT OR Apache-2.0"

description = "A library provides the implementation of some algorithms and data structures related to Sokoban"
repository = "https://github.com/jaminhaber/sokoban-core/tree/main"
keywords = ["sokoban", "solver"]
categories = ["algorithms"]

[[bench]]
name = "benchmark"
harness = false

# https://bheisler.github.io/criterion.rs/book/faq.html#cargo-bench-gives-unrecognized-option-errors-for-valid-command-line-options
[lib]
bench = false

[dependencies]
bitflags = "2.9"
itertools = "0.14"
# FxHash is ~3× faster than the std SipHasher for the small fixed-size keys
# used in the search hot path (StateKey carries a precomputed u64 already).
rustc-hash = "2.1"
# Inline storage for `Node::successors` — typical states have <16 successors,
# so we avoid heap allocations on the inner loop.
smallvec = "1.15"
thiserror = "2.0"

[dev-dependencies]
indoc = "2.0"
criterion = { version = "0.6", features = ["html_reports"] }
